{% extends "base.html" %}
{% block title %}Wishlist — NexaShop{% endblock %}
{% block content %}
<div class="pag-hero page-hero-sm">
    <div class="container">
        <h1>My Wishlist</h1>
        <p>{{ items|length }} saved item{{ 's' if items||length !=1 }}</p>
    </div>
</div>
<div class="container" style="padding: 2rem 0;">
    {% if items %}
    <div class="product-card">
        <div class="product-card_img-wrap">
            <img src="{{ p.image }}" alt="{{ p.name }}" loading="lazy" />
            <a href="{{ url_for('toggle_wishlist', product_id=p.id) }}" class="wishlist-remove" title="Remove"></a>
        </div>h
    </div>
    {% endif %}
</div>
{% endblock %}
