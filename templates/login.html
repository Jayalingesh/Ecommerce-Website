{% extends "base.html" %}
{% block title %}Sign In — NexaShop{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-card_header">
            <div class="auth-logo">
                <i class="fa fa-bolt"></i>
            </div>
            <h2>Welcome Back</h2>
            <p>Sign in to your NexaShop account</p>
        </div>
        <form action="{{ url_for('login') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label><i class="fa fa-envelope"></i>Email Address</label>
                <input type="email" name="email" class="form-input" required placeholder="Enter your email address">
            </div>
            <div class="form-group">
                <label><i class="fa fa-lock"></i>Password</label>
                <div style="position: relative;">
                    <input type="password" name="password" id="pwInput" class="form-input" required placeholder="••••••••" minlength="8">
                    <button type="button" class="pw-toggle" onclick="togglePw()"><i class="fa fa-eye-slash" id="pwIcon"></i></button>
                </div>
            </div>
            <div class="auth-options">
                <label>
                    <input type="checkbox" />
                    <span>Remember me</span>
                </label>
                <a href="#">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn-primary btn-full btn-lg">Sign In</button>
        </form>
        <div class="auth-divider"><span>or</span></div>
        <div class="auth-social">
            <button class="btn btn-ghost btn-full" onclick="alert('Social login coming soon!')">
                <img src="https://www.google.com/favicon.ico" width="16" alt="G" />
            </button>
        </div>
        <p class="auth-link">Don't have an account? <a href="{{ url_for('register') }}">Create one</a></p>
    </div>
</div>
<script>
    function togglePw() {
        const inp = document.getElementById('pwInput');
        const icon = document.getElementById('pwIcon');

        if(inp.type === 'password'){
            inp.type = 'text';
            icon.className = 'fa fa-eye';
        }else{
            inp.type = 'password';
            icon.className = 'fa fa-eye-slash';
        }
    }
</script>
{% endblock %}
